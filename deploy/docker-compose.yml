services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/quant_agent_lab.db
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    # 2C2G 小机器上限制资源，避免 LangGraph/依赖把内存吃光
    mem_limit: 700m

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
